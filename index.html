<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>roguedivers2</title>
    <script>
      // Apply a saved light/dark choice before first paint, so the page doesn't flash the OS
      // theme first. Kept in sync afterwards by src/data/useTheme.ts (same storage key).
      try {
        var theme = localStorage.getItem("Roguedivers2Theme");
        if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
